name: Build Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install Endstone
      run: |
        python -m pip install --upgrade pip
        pip install endstone
        
    - name: Get Endstone CMake Path
      id: endstone_path
      shell: bash
      run: |
        echo "dir=$(python -c 'import endstone, os; print(os.path.dirname(endstone.__file__))')" >> $GITHUB_OUTPUT
        
    - name: Configure CMake
      shell: bash
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ steps.endstone_path.outputs.dir }}"
      
    - name: Build Plugin
      shell: bash
      run: |
        cmake --build build --config Release
      
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rsnhybridplugin-${{ runner.os }}
        path: |
          build/**/*.so
          build/**/*.dll
          build/Release/*.dll
